<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Os dois lados do boato</title>
<meta name="description" content="Newsgame em dois atos sobre desinformação e leitura lateral, para a oficina de Fundamentos de Jornalismo.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%9E%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root {
  --cherry: #990011;
  --navy: #2F3C7E;
  --paper: #FCF6F5;
  --bg: #FCF6F5;
  --text: #1C2143;
  --muted: #595F7F;
  --line: #E6DCD9;
  --surface: #FFFFFF;
  --soft: #F4EAE8;
  --accent: #2F3C7E;
  --accent-2: #990011;
  --bar: #990011;
  --focus: #D98E04;
  --serif: Cambria, Georgia, "Noto Serif", "Times New Roman", serif;
  --sans: Calibri, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11152E;
    --text: #EFE7E4;
    --muted: #A9AEC8;
    --line: #2B3260;
    --surface: #1A2045;
    --soft: #222A55;
    --accent: #A3AEEF;
    --accent-2: #F08494;
    --bar: #E0435A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11152E;
  --text: #EFE7E4;
  --muted: #A9AEC8;
  --line: #2B3260;
  --surface: #1A2045;
  --soft: #222A55;
  --accent: #A3AEEF;
  --accent-2: #F08494;
  --bar: #E0435A;
  color-scheme: dark;
}
/* Ato 1: a fábrica é sempre escura, de propósito */
body.fabrica {
  --bg: #141A36;
  --text: #F2EAE8;
  --muted: #AAB0CE;
  --line: #2C3466;
  --surface: #1F2652;
  --soft: #283063;
  --accent: #A3AEEF;
  --accent-2: #F08494;
  --bar: #E0435A;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  transition: background-color .4s ease, color .4s ease;
}
@media (max-width: 360px) { body { font-size: 16px; } }

.wrap { max-width: 36rem; margin: 0 auto; padding: 1.25rem 1rem 2.5rem; }
h1, h2, h3 { font-family: var(--serif); font-weight: 700; line-height: 1.12; margin: 0 0 .6rem; }
h1 { font-size: clamp(2.3rem, 9vw, 3.3rem); letter-spacing: -.01em; }
h2 { font-size: 1.7rem; }
h3 { font-size: 1.2rem; }
p { margin: 0 0 .8rem; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
h1:focus, h2:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

button { font: inherit; cursor: pointer; color: inherit; }
.btn {
  display: block; width: 100%;
  padding: .95rem 1rem;
  border: 0; border-radius: 12px;
  background: var(--navy); color: #fff;
  font-weight: 700; font-size: 1.02rem; text-align: center;
  margin-top: 1rem;
}
.btn.cherry { background: var(--cherry); }
.fabrica .btn.cherry { background: #B3102A; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--line); }
.linkbtn { background: none; border: 0; padding: .4rem 0; color: var(--muted); text-decoration: underline; font-size: .88rem; }

/* ---------- Capa ---------- */
.capa h1 { margin-top: .75rem; }
.capa .lede { font-size: 1.08rem; color: var(--muted); max-width: 30rem; }
.diptico { display: grid; grid-template-columns: 1fr 1fr; border-radius: 16px; overflow: hidden; margin: 1.25rem 0 1.4rem; border: 1px solid var(--line); }
.diptico > div { padding: 1rem .9rem 1.1rem; }
.diptico .lado1 { background: #141A36; color: #F2EAE8; }
.diptico .lado2 { background: #FCF6F5; color: #1C2143; }
.diptico .ato { font-family: var(--serif); font-size: 1.25rem; font-weight: 700; line-height: 1.1; margin-bottom: .4rem; }
.diptico .lado1 .ato span { color: #F08494; }
.diptico .lado2 .ato span { color: #990011; }
.diptico p { font-size: .92rem; margin: 0; }
@media (max-width: 380px) { .diptico { grid-template-columns: 1fr; } }
.campo label { display: block; font-weight: 700; margin-bottom: .35rem; }
.campo input {
  width: 100%; font: inherit; padding: .8rem .9rem;
  border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--text);
}
.aviso-ficcao { font-size: .88rem; color: var(--muted); margin-top: .9rem; }

/* ---------- Ato 1 ---------- */
.painel {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.painel .in { max-width: 36rem; margin: 0 auto; padding: .7rem 1rem .6rem; }
.medidores { display: flex; gap: 1rem; align-items: flex-end; }
.medidores > .medidor:first-child { min-width: 9rem; }
.medidor .rot { font-size: .8rem; color: var(--muted); }
.seg { display: inline-block; position: relative; font-family: var(--serif); font-size: 1.9rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.delta { position: absolute; left: 100%; top: -.2rem; margin-left: .4rem; font-family: var(--sans); font-size: .85rem; font-weight: 700; white-space: nowrap; animation: sobe 1.6s ease-out forwards; }
.delta.pos { color: #7EE0A6; } .delta.neg { color: var(--accent-2); }
@keyframes sobe { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
.cred { flex: 1; }
.barra { height: 10px; border-radius: 6px; background: var(--soft); overflow: hidden; margin-top: .35rem; }
.barra i { display: block; height: 100%; background: var(--bar); border-radius: 6px; transition: width .6s ease; }
.insignias { display: flex; gap: .4rem; margin-top: .55rem; }
.insignia { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; font-size: 1rem; background: var(--soft); filter: grayscale(1); opacity: .45; }
.insignia.on { filter: none; opacity: 1; background: #3A1330; box-shadow: inset 0 0 0 2px #E0435A; }

.chat { display: flex; flex-direction: column; gap: .55rem; padding-top: .9rem; }
.msg { max-width: 88%; padding: .7rem .9rem; border-radius: 16px 16px 16px 4px; background: var(--surface); }
.msg.eu { align-self: flex-end; background: #990011; color: #fff; border-radius: 16px 16px 4px 16px; }
.msg.atual { scroll-margin-top: 9.5rem; }
.msg .quem { display: block; font-size: .75rem; color: var(--muted); margin-bottom: .15rem; }
.capitulo { margin: 1.1rem 0 .1rem; font-family: var(--serif); font-size: 1.15rem; color: var(--accent-2); scroll-margin-top: 9.5rem; }
.capitulo .num { color: var(--muted); font-family: var(--sans); font-size: .85rem; display: block; }
.ganhou { align-self: stretch; border: 1.5px dashed #E0435A; border-radius: 14px; padding: .8rem .9rem; background: rgba(224, 67, 90, .08); }
.ganhou strong { font-family: var(--serif); font-size: 1.05rem; }
.opcoes { display: grid; gap: .5rem; margin-top: .35rem; }
.opcao {
  text-align: left; padding: .8rem .95rem;
  border-radius: 12px; border: 1.5px solid var(--line);
  background: transparent; line-height: 1.4;
}
.opcao:hover { border-color: #E0435A; }
.novo { animation: entra .35s ease-out both; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.estrago { list-style: none; padding: 0; margin: .5rem 0 1rem; }
.estrago li { padding: .65rem 0; border-bottom: 1px solid var(--line); }
.estrago li:last-child { font-weight: 700; color: #F4B3BD; border-bottom: 0; }
.placar { display: flex; gap: 1.5rem; margin: .5rem 0 1rem; }
.placar .n { font-family: var(--serif); font-size: 2.2rem; font-weight: 700; line-height: 1; }

/* ---------- Ato 2 ---------- */
.topo { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; font-size: .85rem; color: var(--muted); }
.caso-h { margin-top: .2rem; }
.situacao { font-size: 1rem; }
.aparelho { border-radius: 16px; overflow: hidden; border: 1px solid #CFCAD6; background: #fff; color: #1b1b1b; margin: .8rem 0 1rem; box-shadow: 0 1px 0 rgba(0,0,0,.04); }
.abas { display: flex; gap: 4px; overflow-x: auto; background: #E7E4EC; padding: 6px 6px 0; scrollbar-width: none; }
.aba { flex: 0 0 auto; max-width: 11.5rem; padding: .38rem .65rem; border-radius: 8px 8px 0 0; background: #D6D2DE; color: #33364A; font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aba.primeira { background: #fff; color: #1b1b1b; font-weight: 700; }
.aba.nova { background: #2F3C7E; color: #fff; }
.aba.nova.recente { animation: abre .45s ease-out; }
@keyframes abre { from { transform: translateY(100%); opacity: 0; } to { transform: none; opacity: 1; } }
.barra-end { display: flex; align-items: center; gap: .4rem; padding: .45rem .7rem; border-bottom: 1px solid #ECE9F0; font-size: .8rem; color: #444; }
.barra-end .end { max-width: 13rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mock { position: relative; }
.selo { position: absolute; top: .5rem; right: .5rem; z-index: 2; background: #990011; color: #fff; font-size: .68rem; font-weight: 700; padding: .2rem .5rem; border-radius: 999px; }

.apuracao { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin: .2rem 0 .5rem; }
.apuracao .rot { font-weight: 700; }
.bolinhas { display: inline-flex; gap: .3rem; }
.bolinhas i { width: .8rem; height: .8rem; border-radius: 50%; background: var(--accent); }
.bolinhas i.gasta { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
.movs { list-style: none; padding: 0; margin: 0 0 .5rem; display: grid; gap: .5rem; }
.mov > button {
  width: 100%; display: flex; justify-content: space-between; align-items: center; gap: .6rem;
  text-align: left; padding: .8rem .9rem; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--surface); line-height: 1.35;
}
.mov > button:disabled { opacity: .45; cursor: not-allowed; }
.tag { flex: 0 0 auto; font-size: .72rem; font-weight: 700; padding: .15rem .45rem; border-radius: 999px; white-space: nowrap; }
.tag.v { background: var(--soft); color: var(--muted); }
.tag.l { background: var(--navy); color: #fff; }
.carta { border-radius: 12px; padding: .75rem .9rem; background: var(--surface); border: 1.5px solid var(--line); border-left-width: 6px; }
.carta .o-que { font-size: .8rem; color: var(--muted); display: flex; justify-content: space-between; gap: .5rem; margin-bottom: .2rem; }
.carta.l { border-left-color: var(--navy); }
.carta.v { border-left-color: #B9B3C2; }
.carta.neutra { border-left-color: var(--muted); }
.acabou { font-size: .92rem; color: var(--accent-2); font-weight: 700; margin: .2rem 0 0; }

.veredicto { margin-top: 1.25rem; padding: 1rem; border-radius: 16px; background: var(--soft); scroll-margin-top: 1rem; }
.veredicto fieldset { border: 0; padding: 0; margin: 0 0 1rem; }
.veredicto legend { font-weight: 700; margin-bottom: .45rem; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: .45rem; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip span { display: inline-block; padding: .55rem .8rem; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); line-height: 1.25; cursor: pointer; }
.chip input:checked + span { background: var(--navy); color: #fff; border-color: var(--navy); }
.chip input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.evid { display: grid; gap: .45rem; }
.evid label { display: flex; gap: .6rem; align-items: flex-start; padding: .6rem .7rem; border-radius: 10px; background: var(--surface); border: 1.5px solid var(--line); cursor: pointer; font-size: .95rem; line-height: 1.4; }
.evid input { margin-top: .25rem; width: 1.1rem; height: 1.1rem; accent-color: #2F3C7E; flex: 0 0 auto; }
.falta { font-size: .88rem; color: var(--muted); min-height: 1.3em; margin: 0; }

.resultado { border-radius: 16px; padding: 1rem 1.05rem; margin: .5rem 0 1rem; color: #fff; }
.resultado.sim { background: var(--navy); }
.resultado.nao { background: var(--cherry); }
.resultado h2 { font-size: 1.45rem; margin-bottom: .3rem; }
.resultado p { margin: 0; }
.bloco { margin: 0 0 1.1rem; }
.bloco h3 { font-size: 1.05rem; margin-bottom: .35rem; }
.nota { border-left: 4px solid var(--accent); padding: .1rem 0 .1rem .8rem; }
.alerta { border-left: 4px solid var(--accent-2); padding: .1rem 0 .1rem .8rem; }
.decisiva { padding: .7rem .85rem; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); margin-bottom: .45rem; }
.decisiva .status { display: block; font-size: .8rem; color: var(--muted); margin-top: .3rem; }
.caminho { display: flex; flex-wrap: wrap; gap: .4rem; }
.pontos { list-style: none; padding: 0; margin: 0; }
.pontos li { display: flex; justify-content: space-between; gap: 1rem; padding: .35rem 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
.pontos li:last-child { border-bottom: 0; font-weight: 700; }

.passos { list-style: none; padding: 0; margin: .4rem 0 1rem; counter-reset: p; }
.passos li { position: relative; padding: .6rem 0 .6rem 2.6rem; border-bottom: 1px solid var(--line); }
.passos li::before { counter-increment: p; content: counter(p); position: absolute; left: 0; top: .55rem; width: 1.9rem; height: 1.9rem; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: #fff; font-weight: 700; font-family: var(--serif); }
.passos strong { font-family: var(--serif); }
.seu-caminho { font-size: 1.05rem; padding: .8rem .9rem; border-radius: 12px; background: var(--soft); }

/* ---------- Cartão final ---------- */
.cartao { border-radius: 18px; border: 1.5px solid var(--line); background: var(--surface); padding: 1.1rem 1rem; }
.cartao .dupla { font-family: var(--serif); font-size: 1.5rem; font-weight: 700; line-height: 1.15; margin-bottom: .2rem; }
.cartao section { padding-top: .9rem; margin-top: .9rem; border-top: 1px solid var(--line); }
.cartao h3 { font-size: 1.05rem; }
.lousa { background: var(--navy); color: #fff; border-radius: 14px; padding: .85rem .95rem; }
.lousa p { margin: 0 0 .35rem; }
.lousa p:last-child { margin: 0; }
.tabela { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tabela th, .tabela td { text-align: left; padding: .4rem .3rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.tabela th { font-weight: 700; color: var(--muted); font-size: .8rem; }
.ok { color: var(--accent); font-weight: 700; }
.nok { color: var(--accent-2); font-weight: 700; }
.perfil-nome { font-family: var(--serif); font-size: 1.35rem; font-weight: 700; color: var(--accent-2); }
.fund { list-style: none; padding: 0; margin: .4rem 0 0; display: grid; gap: .35rem; }
.fund button { width: 100%; text-align: left; padding: .55rem .7rem; border-radius: 10px; border: 1.5px solid var(--line); background: transparent; font-size: .95rem; line-height: 1.35; }
.fund button[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
.fund .n { font-family: var(--serif); font-weight: 700; margin-right: .35rem; }
.perguntas p { font-family: var(--serif); font-size: 1.05rem; }
.refs { font-size: .8rem; color: var(--muted); }
.refs p { margin: 0 0 .45rem; }
.rodape { max-width: 36rem; margin: 0 auto; padding: 0 1rem 2rem; text-align: center; }

/* ---------- Maquetes dos conteúdos (sempre com cara de tela, qualquer tema) ---------- */
.m-ibpc { padding: 1rem 1rem 1.1rem; font-family: "Segoe UI", Roboto, Arial, sans-serif; background: #fff; color: #16324F; }
.m-ibpc .topo-site { display: flex; align-items: center; gap: .6rem; padding-right: 6.5rem; }
.m-ibpc .logo { background: #0E6BA8; color: #fff; font-weight: 800; letter-spacing: .02em; padding: .35rem .5rem; border-radius: 6px; font-size: .95rem; }
.m-ibpc .nome { font-size: .8rem; line-height: 1.2; color: #3C5A78; }
.m-ibpc .faixa { margin: .8rem 0 .6rem; font-size: .75rem; color: #0E6BA8; font-weight: 700; }
.m-ibpc .tit { font-size: 1.28rem; line-height: 1.2; font-weight: 800; margin: 0 0 .5rem; color: #0B2239; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
.m-ibpc .lead { font-size: .92rem; color: #2A4460; margin: 0 0 .6rem; }
.m-ibpc .refs-site { font-size: .72rem; color: #6A7F95; margin: .5rem 0 0; border-top: 1px solid #E3EAF1; padding-top: .45rem; }

.m-blog { background: #FFF6A8; color: #111; font-family: "Comic Sans MS", "Chalkboard SE", "Segoe Print", cursive, sans-serif; }
.m-blog .cab { background: #E3001B; color: #FFF200; font-weight: 900; padding: .65rem 7rem .65rem .8rem; font-size: .95rem; line-height: 1.2; }
.m-blog .post { padding: .8rem; }
.m-blog .post h4 { margin: 0 0 .45rem; font-size: 1.12rem; line-height: 1.2; color: #B00000; text-decoration: underline; }
.m-blog .post p { font-size: .92rem; margin: 0 0 .5rem; }
.m-blog .lateral { background: #FFE14D; padding: .5rem .8rem; font-size: .82rem; border-top: 3px dotted #E3001B; }
.m-blog .lateral span { display: block; }

.m-zap { background: #E9DFD5; font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #111; }
.m-zap .cab { background: #075E54; color: #fff; padding: .6rem .8rem; font-weight: 700; padding-right: 7rem; }
.m-zap .cab small { display: block; font-weight: 400; opacity: .8; font-size: .72rem; }
.m-zap .corpo { padding: .8rem .7rem 1rem; }
.m-zap .bolha { background: #fff; border-radius: 0 10px 10px 10px; padding: .45rem .55rem .35rem; max-width: 92%; box-shadow: 0 1px 1px rgba(0,0,0,.12); }
.m-zap .enc { font-size: .72rem; color: #667781; font-style: italic; margin-bottom: .15rem; }
.m-zap .autor { font-size: .8rem; font-weight: 700; color: #C2185B; margin-bottom: .3rem; }
.m-zap .bolha p { font-size: .93rem; margin: .45rem 0 .1rem; }
.m-zap .hora { display: block; text-align: right; font-size: .68rem; color: #667781; }
.m-zap svg { display: block; width: 100%; height: auto; border-radius: 6px; }

.m-jornal { background: #fff; color: #121212; padding: .8rem 1rem 1rem; font-family: Georgia, "Times New Roman", serif; }
.m-jornal .mast { font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; padding: .1rem 6.5rem .35rem 0; border-bottom: 3px double #121212; }
.m-jornal .nav { display: flex; justify-content: center; gap: .8rem; font-family: Arial, sans-serif; font-size: .72rem; padding: .35rem 0; border-bottom: 1px solid #ddd; color: #444; }
.m-jornal .tag-j { display: inline-block; margin: .7rem 0 .35rem; font-family: Arial, sans-serif; font-size: .72rem; font-weight: 700; color: #fff; background: #C4161C; padding: .1rem .4rem; }
.m-jornal .tit { font-size: 1.28rem; line-height: 1.18; margin: 0 0 .4rem; font-family: Georgia, "Times New Roman", serif; }
.m-jornal .linha { font-size: .92rem; color: #444; margin: 0 0 .6rem; }
.m-jornal .foto { display: flex; gap: .7rem; align-items: center; margin-bottom: .6rem; }
.m-jornal .foto svg { width: 4.2rem; height: 4.2rem; flex: 0 0 auto; }
.m-jornal .foto small { font-family: Arial, sans-serif; font-size: .75rem; color: #666; }
.m-jornal .cta { display: block; text-align: center; background: #1E9E4A; color: #fff; font-family: Arial, sans-serif; font-weight: 700; padding: .65rem; border-radius: 6px; margin: .4rem 0 .6rem; }
.m-jornal .com { font-family: Arial, sans-serif; font-size: .8rem; color: #333; background: #F3F3F3; border-radius: 6px; padding: .45rem .55rem; margin-top: .35rem; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* Maquetes acrescentadas na segunda rodada */
.m-centro { background: #fff; color: #12263A; padding: 1rem; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
.m-centro .topo-uni { display: flex; gap: .6rem; align-items: center; padding-right: 6.5rem; }

.m-zap .audio .play { color: #075E54; font-size: .95rem; }
.m-zap .audio svg { flex: 1; width: auto; height: 24px; border-radius: 0; }
.m-zap .audio .dur { font-size: .7rem; color: #667781; }

/* Envio do resultado */
a.btn { text-decoration: none; }
.entrega { padding-top: .9rem; margin-top: .9rem; border-top: 1px solid var(--line); }
.entrega .btn { margin-top: .6rem; }
.entrega .linkbtn { display: inline-block; margin-top: .5rem; }
details.cru { margin-top: .7rem; }
details.cru summary { cursor: pointer; font-size: .88rem; color: var(--muted); }
.resumo-cru { width: 100%; min-height: 9.5rem; margin-top: .5rem; font: inherit; font-size: .82rem; line-height: 1.4; padding: .6rem; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--text); }

/* Perguntas da plenária com resposta */

.rotulo { display: block; font-weight: 700; margin: .7rem 0 .35rem; font-family: var(--sans); }
textarea.resposta { width: 100%; min-height: 5.5rem; font: inherit; font-size: .95rem; padding: .6rem .7rem; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--text); }

.lousa .codigo { font-family: var(--serif); font-size: 1.6rem; font-weight: 700; letter-spacing: .02em; margin: .2rem 0 .3rem; }
.entrega .btn.ghost { margin-top: .5rem; }

  function pdfTexto(t) {
    var mapa = { "\u2018": "\x91", "\u2019": "\x92", "\u201C": "\x93", "\u201D": "\x94", "\u2026": "\x85", "\u2013": "\x96", "\u2014": "\x97", "\u2022": "\x95" };
    var out = "";
    for (var i = 0; i < t.length; i++) {
      var ch = t.charAt(i);
      if (mapa[ch]) ch = mapa[ch];
      if (ch.charCodeAt(0) > 255) ch = "?";

      out += ch;

  function quebraLinha(t, max) {

      else { linhas.push(atual); atual = w; }

    if (atual.length) linhas.push(atual);
    return linhas.length ? linhas : [""];

      quebraLinha(b.t, max).forEach(function (l, i) {
        linhas.push({ txt: l, fonte: fonte, tam: tam });
      });
    });
    var paginas = [], atual = [];
    linhas.forEach(function (l) {
      if (atual.length >= 48) { paginas.push(atual); atual = []; }
      atual.push(l);

    var conteudos = paginas.map(function (pag) {
      var st = "BT 50 792 Td 15 TL\n";

      pag.forEach(function (l) {

        var chave = l.fonte + " " + l.tam;
        if (chave !== fonteAtual) { st += "/" + l.fonte + " " + l.tam + " Tf\n"; fonteAtual = chave; }
        st += "(" + pdfTexto(l.txt) + ") Tj T*\n";
      });
      return st + "ET";
    });

    var objs = [];
    var nPag = paginas.length;
    var kids = [];

    objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
    objs[2] = "<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + nPag + " >>";
    objs[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
    objs[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
    for (var j = 0; j < nPag; j++) {
      objs[5 + j * 2] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents " + (6 + j * 2) + " 0 R >>";
      objs[6 + j * 2] = "<< /Length " + conteudos[j].length + " >>\nstream\n" + conteudos[j] + "\nendstream";
    }
    var arq = "%PDF-1.4\n";
    var offsets = [];
    for (var k = 1; k < objs.length; k++) {
      offsets[k] = arq.length;
      arq += k + " 0 obj\n" + objs[k] + "\nendobj\n";
    }
    var inicioXref = arq.length;
    arq += "xref\n0 " + objs.length + "\n0000000000 65535 f \n";
    for (var m2 = 1; m2 < objs.length; m2++) {
      var o = String(offsets[m2]);
      while (o.length < 10) o = "0" + o;
      arq += o + " 00000 n \n";
    }
    arq += "trailer\n<< /Size " + objs.length + " /Root 1 0 R >>\nstartxref\n" + inicioXref + "\n%%EOF";
    var bytes = new Uint8Array(arq.length);
    for (var n2 = 0; n2 < arq.length; n2++) bytes[n2] = arq.charCodeAt(n2) & 255;
    return new Blob([bytes], { type: "application/pdf" });
  }
  function nomeArquivo(ext) {

    base = base.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
    return "atividade-" + (base || "dupla") + "." + ext;

  function baixaPorLink(nome, blob) {

      var a = document.createElement("a");
      a.href = url; a.download = nome; a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch (e) {}
      }, 5000);
      avisa("Arquivo gerado: " + nome + ". Procure na pasta de downloads do celular.");

  function salvaArquivo(nome, blob) {

    var usouClaude = false;
    try {
      if (window.claude && window.claude.use) {
        usouClaude = true;
        window.claude.use("downloads").then(function (d) {
          if (!d) return baixaPorLink(nome, blob);
          d.save({ filename: nome, data: blob }).then(function () {
            avisa("Arquivo salvo: " + nome + ".");
          }, function (err) {
            if (err && err.code === "declined") avisa("Salvamento cancelado.");
            else baixaPorLink(nome, blob);
          });
        }, function () { baixaPorLink(nome, blob); });
      }
    } catch (e) { usouClaude = false; }
    if (!usouClaude) baixaPorLink(nome, blob);
  }
  function compartilhaArquivo(nome, blob, tipo) {

        navigator.share({ files: [f], title: "Atividade da dupla " + (S.dupla || "") }).then(function () {

  function animaNumero(el, de, para) {
    if (semMovimento || de === para) { el.firstChild && (el.firstChild.nodeValue = num(para)); return; }
    var t0 = null, dur = 700;
    function passo(t) {
      if (!t0) t0 = t;
      var k = Math.min(1, (t - t0) / dur);
      var val = Math.round(de + (para - de) * (1 - Math.pow(1 - k, 3)));
      if (el.firstChild) el.firstChild.nodeValue = num(val);
      if (k < 1) requestAnimationFrame(passo);
    }
    requestAnimationFrame(passo);
  }

      var citou = rascunho.cartas.some(function (x) { return decisivas.indexOf(x) >= 0; });
      var lateral = feitos2.some(function (x) { return movDe(c2, x).tipo === "L"; });
      var penal = !aceito && rascunho.conf === "Alta";

      S.a2.c = S.a2.ordem.length - 1;

    if (a === "fund") {

      salvar(); render(); return;

    if (a === "concluir") {
      if (!canalPrincipal("x")) salvaArquivo(nomeArquivo("pdf"), gerarPDF());
      setTimeout(function () {
        S.concluido = agora();
        S.tela = "fim";
        salvar();
        render("topo");
      }, 80);
      return;
    }
    if (a === "pdf") { salvaArquivo(nomeArquivo("pdf"), gerarPDF()); return; }
    if (a === "md") { salvaArquivo(nomeArquivo("md"), new Blob([mdTexto()], { type: "text/markdown" })); return; }
    if (a === "share") {
      if (!compartilhaArquivo(nomeArquivo("pdf"), gerarPDF(), "application/pdf")) {
        avisa("Este navegador não abre o menu de compartilhar. Baixe o PDF e anexe onde precisar.");
      }
      return;
    }
    if (a === "verCartao") { S.tela = "final"; salvar(); render("topo"); return; }
    if (a === "copiar") {
      var area = document.getElementById("resumo-cru");
      var aviso = document.getElementById("copiado");
      var txt = area ? area.value : resumoTexto();
      function ok() { if (aviso) aviso.textContent = "Copiado. Agora é só colar onde o professor pediu."; }
      function falhou() {
        if (aviso) aviso.textContent = "O navegador não deixou copiar. Abra “Ver o texto do resultado” e copie à mão.";
        var d = document.querySelector("details.cru");
        if (d) d.open = true;
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(ok, function () { copiaAntiga(area, ok, falhou); });
        } else copiaAntiga(area, ok, falhou);
      } catch (e) { copiaAntiga(area, ok, falhou); }
      return;
    }
    if (a === "recomecar") {
      if (window.confirm("Apagar o progresso e recomeçar o jogo?")) {
        apagar(); salvo = null; S = novo(); render("topo");
      }
      return;
    }
  });

  render("topo");
})();

</script>

</html>
